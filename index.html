
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>hamayal Boutique</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar px-4">
        <h3>Hamayal♡</h3>
        <a href="#cart">BAG</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero text-center">
        <p>THE EVERYDAY LUXE COLLECTION</p>
        <h1>Little Luxuries.<br>Beautifully Yours.</h1>
        <a href="#shop" class="btn btn-dark">SHOP NOW</a>
    </section>

    <!-- Products Section -->
    <div class="container py-5" id="shop">

        <h2 class="mb-4">Our Collection</h2>

        <div class="row g-4" id="products"></div>

        <!-- Shopping Cart -->
        <div class="cart p-4 mt-5" id="cart">
            <h3>Shopping Bag ♡</h3>

            <div id="items">Your bag is empty.</div>

            <h5 class="mt-3">
                Total: Rs. <span id="total">0</span>
            </h5>
        </div>

    </div>

    <!-- Footer -->
    <footer>HAMAYAL — A little luxury, every day.</footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
